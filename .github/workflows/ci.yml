name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

# Values come from repository secrets. Non-sensitive settings fall back to a default when the
# secret is unset/empty (an empty string would defeat the Zod defaults and fail validation).
env:
    ENVIRONMENT: ${{ secrets.ENVIRONMENT || 'test' }}
    PORT: ${{ secrets.PORT || '3000' }}
    DATABASE_HOST: ${{ secrets.DATABASE_HOST || 'localhost' }}
    DATABASE_PORT: ${{ secrets.DATABASE_PORT || '5432' }}
    DATABASE_USER: ${{ secrets.DATABASE_USER }}
    DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
    DATABASE_DB: ${{ secrets.DATABASE_DB }}
    JWT_SECRET: ${{ secrets.JWT_SECRET }}
    JWT_EXPIRATION_SECONDS: ${{ secrets.JWT_EXPIRATION_SECONDS || '3600' }}
    RATE_LIMIT_WINDOW_MS: ${{ secrets.RATE_LIMIT_WINDOW_MS || '900000' }}
    RATE_LIMIT_MAX: ${{ secrets.RATE_LIMIT_MAX || '100' }}
    TRUST_PROXY_HOPS: ${{ secrets.TRUST_PROXY_HOPS || '1' }}
    LOGIN_RATE_LIMIT_WINDOW_MS: ${{ secrets.LOGIN_RATE_LIMIT_WINDOW_MS || '900000' }}
    LOGIN_RATE_LIMIT_MAX: ${{ secrets.LOGIN_RATE_LIMIT_MAX || '5' }}

jobs:
    test:
        name: Verify
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            postgres:
                image: postgres:18.4-alpine
                env:
                    POSTGRES_USER: ${{ secrets.DATABASE_USER }}
                    POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
                    POSTGRES_DB: ${{ secrets.DATABASE_DB }}
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Run database migrations
              run: npm run db:migrate
            - name: Lint
              run: npm run lint
            - name: Verify application
              run: npm run typecheck
            - name: Check application build
              run: npm build
            - name: Run tests
              run: npm test